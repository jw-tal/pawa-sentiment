<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment - PNG Social Media Intelligence</title>
    <style>
        /* Font Imports */
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Instrument+Serif:wght@400&display=swap');
        
        /* CSS Variables - Design System */
        :root {
            /* Colors */
            --white: #FFFFFF;
            --cream: #FAF9F6;
            --cream-dark: #F5F3EF;
            --fluro-green: #00FF66;
            --fluro-orange: #FF6B35;
            --fluro-blue: #00B4D8;
            --text-dark: #1A1A1A;
            --text-gray: #666666;
            
            /* Typography - Only 3 Sizes */
            --type-large: 32px;
            --type-medium: 16px;
            --type-small: 13px;
            
            /* Spacing */
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 32px;
            --space-xl: 48px;
        }
        
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Instrument Sans', sans-serif;
            font-size: var(--type-medium);
            color: var(--text-dark);
            background: var(--cream);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Container - Mobile First */
        .container {
            max-width: 100%;
            padding: var(--space-md);
            margin: 0 auto;
        }
        
        @media (min-width: 768px) {
            .container {
                max-width: 1200px;
                padding: var(--space-xl) var(--space-md);
            }
        }
        
        /* Header */
        .header {
            margin-bottom: var(--space-lg);
        }
        
        .logo {
            font-family: 'Instrument Serif', serif;
            font-size: var(--type-large);
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: var(--space-xs);
        }
        
        .tagline {
            font-size: var(--type-small);
            color: var(--text-gray);
            margin-bottom: var(--space-md);
        }
        
        .last-updated {
            font-size: var(--type-small);
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }
        
        .refresh-btn {
            background: var(--white);
            border: 1px solid var(--cream-dark);
            padding: 10px 20px;
            font-family: 'Instrument Sans', sans-serif;
            font-size: var(--type-small);
            color: var(--text-dark);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            margin-top: var(--space-sm);
        }
        
        .refresh-btn:hover {
            border-color: var(--fluro-green);
            transform: translateY(-1px);
        }
        
        /* Insight Card - Hero */
        .insight-hero {
            background: var(--white);
            padding: var(--space-lg);
            border-radius: 12px;
            margin-bottom: var(--space-md);
            border-left: 4px solid var(--fluro-green);
        }
        
        .insight-icon {
            font-size: var(--type-large);
            margin-bottom: var(--space-sm);
        }
        
        .insight-title {
            font-family: 'Instrument Serif', serif;
            font-size: var(--type-large);
            margin-bottom: var(--space-sm);
            line-height: 1.2;
        }
        
        .insight-description {
            font-size: var(--type-medium);
            color: var(--text-gray);
            margin-bottom: var(--space-md);
        }
        
        .insight-metric {
            display: inline-block;
            background: var(--cream-dark);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: var(--type-medium);
            font-weight: 600;
        }
        
        /* Actions Card */
        .actions-card {
            background: var(--white);
            padding: var(--space-lg);
            border-radius: 12px;
            margin-bottom: var(--space-md);
        }
        
        .actions-title {
            font-size: var(--type-large);
            margin-bottom: var(--space-md);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .action-item {
            padding: var(--space-sm);
            margin-bottom: var(--space-sm);
            border-left: 3px solid var(--cream-dark);
            transition: border-color 0.2s;
        }
        
        .action-item:hover {
            border-left-color: var(--fluro-blue);
        }
        
        .action-item:last-child {
            margin-bottom: 0;
        }
        
        .action-label {
            font-size: var(--type-small);
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .action-text {
            font-size: var(--type-medium);
            color: var(--text-dark);
        }
        
        /* Collapsible Section */
        .collapsible-section {
            background: var(--white);
            border-radius: 12px;
            margin-bottom: var(--space-md);
            overflow: hidden;
        }
        
        .collapsible-header {
            padding: var(--space-md);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }
        
        .collapsible-header:hover {
            background: var(--cream);
        }
        
        .collapsible-title {
            font-size: var(--type-medium);
            font-weight: 600;
        }
        
        .collapsible-arrow {
            font-size: var(--type-medium);
            transition: transform 0.3s;
        }
        
        .collapsible-arrow.open {
            transform: rotate(180deg);
        }
        
        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        
        .collapsible-content.open {
            max-height: 2000px;
        }
        
        .collapsible-inner {
            padding: 0 var(--space-md) var(--space-md) var(--space-md);
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }
        
        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        .stat-card {
            background: var(--cream);
            padding: var(--space-md);
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            font-size: var(--type-small);
            color: var(--text-gray);
            margin-bottom: var(--space-xs);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-value {
            font-size: var(--type-large);
            font-weight: 700;
        }
        
        .stat-percentage {
            font-size: var(--type-small);
            color: var(--text-gray);
            margin-top: 4px;
        }
        
        /* Accent Colors */
        .accent-green { color: var(--fluro-green); }
        .accent-orange { color: var(--fluro-orange); }
        .accent-blue { color: var(--fluro-blue); }
        .border-green { border-left-color: var(--fluro-green); }
        .border-orange { border-left-color: var(--fluro-orange); }
        .border-blue { border-left-color: var(--fluro-blue); }
        
        /* Comments List */
        .comments-list {
            margin-top: var(--space-md);
        }
        
        .comment-item {
            padding: var(--space-sm);
            background: var(--cream);
            border-radius: 6px;
            margin-bottom: var(--space-sm);
            font-size: var(--type-small);
        }
        
        .comment-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--space-xs);
            font-size: var(--type-small);
            color: var(--text-gray);
        }
        
        .comment-text {
            font-size: var(--type-medium);
            color: var(--text-dark);
        }
        
        /* Footer */
        .footer {
            margin-top: var(--space-xl);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--cream-dark);
            text-align: center;
            font-size: var(--type-small);
            color: var(--text-gray);
        }
        
        .footer a {
            color: var(--text-dark);
            text-decoration: none;
            border-bottom: 1px solid var(--cream-dark);
            transition: border-color 0.2s;
        }
        
        .footer a:hover {
            border-bottom-color: var(--fluro-green);
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: var(--space-xl);
            color: var(--text-gray);
        }
        
        /* Chart Container */
        .chart-container {
            margin: var(--space-md) 0;
            padding: var(--space-md);
            background: var(--cream);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">Sentiment</h1>
            <p class="tagline">PNG Social Media Intelligence</p>
            <div class="last-updated" id="lastUpdated">
                <span>●</span>
                <span>Loading...</span>
            </div>
            <button class="refresh-btn" onclick="location.reload()">↻ Refresh Data</button>
        </header>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <p>Loading insights...</p>
        </div>

        <!-- Main Content (Hidden until loaded) -->
        <main id="mainContent" style="display: none;">
            
            <!-- Key Insight Hero -->
            <section class="insight-hero" id="insightHero">
                <div class="insight-icon">🎯</div>
                <h2 class="insight-title" id="insightTitle">Loading...</h2>
                <p class="insight-description" id="insightDescription">Analyzing your audience engagement patterns...</p>
                <span class="insight-metric" id="insightMetric">—</span>
            </section>

            <!-- Recommended Actions -->
            <section class="actions-card">
                <h2 class="actions-title">
                    <span>💡</span>
                    <span>Recommended Actions</span>
                </h2>
                <div id="actionsList">
                    <!-- Actions will be injected here -->
                </div>
            </section>

            <!-- Raw Data (Collapsible) -->
            <section class="collapsible-section">
                <div class="collapsible-header" onclick="toggleCollapsible()">
                    <span class="collapsible-title">▼ View Raw Data</span>
                    <span class="collapsible-arrow" id="arrow">▼</span>
                </div>
                <div class="collapsible-content" id="rawDataContent">
                    <div class="collapsible-inner">
                        
                        <!-- Stats Grid -->
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-label">Total</div>
                                <div class="stat-value" id="totalComments">—</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Positive</div>
                                <div class="stat-value accent-green" id="positiveCount">—</div>
                                <div class="stat-percentage" id="positivePercentage">—</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Negative</div>
                                <div class="stat-value accent-orange" id="negativeCount">—</div>
                                <div class="stat-percentage" id="negativePercentage">—</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Neutral</div>
                                <div class="stat-value accent-blue" id="neutralCount">—</div>
                                <div class="stat-percentage" id="neutralPercentage">—</div>
                            </div>
                        </div>

                        <!-- Top Comments -->
                        <div id="topComments">
                            <!-- Will be populated by JS -->
                        </div>

                    </div>
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by PNG Sentiment Harvester</p>
        </footer>

    </div>

    <script>
        // Toggle collapsible section
        function toggleCollapsible() {
            const content = document.getElementById('rawDataContent');
            const arrow = document.getElementById('arrow');
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                arrow.classList.remove('open');
            } else {
                content.classList.add('open');
                arrow.classList.add('open');
            }
        }

        // Load and display data
        async function loadData() {
            try {
                const response = await fetch('youtube_dashboard_data.json');
                const data = await response.json();
                
                displayData(data);
                
                // Hide loading, show content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loadingState').innerHTML = '<p>Error loading data. Please try again.</p>';
            }
        }

        function displayData(data) {
            const stats = data.stats;
            
            // Update timestamp
            document.getElementById('lastUpdated').innerHTML = `<span>●</span><span>Last updated: ${data.lastUpdated}</span>`;
            
            // Generate strategic insight
            generateInsight(stats);
            
            // Generate actions
            generateActions(data.recommendations);
            
            // Update raw data stats
            document.getElementById('totalComments').textContent = stats.total;
            document.getElementById('positiveCount').textContent = stats.positive;
            document.getElementById('positivePercentage').textContent = `${stats.positive_pct.toFixed(1)}%`;
            document.getElementById('negativeCount').textContent = stats.negative;
            document.getElementById('negativePercentage').textContent = `${stats.negative_pct.toFixed(1)}%`;
            document.getElementById('neutralCount').textContent = stats.neutral;
            document.getElementById('neutralPercentage').textContent = `${stats.neutral_pct.toFixed(1)}%`;
            
            // Display top comments
            displayTopComments(data.topPositive, data.topNegative);
        }

        function generateInsight(stats) {
            let icon = '🎯';
            let title = '';
            let description = '';
            let metric = '';
            let accentClass = 'border-green';
            
            // Determine primary insight based on data
            if (stats.neutral_pct >= 70) {
                icon = '🎯';
                title = 'High Neutral Engagement';
                description = 'Your audience is watching but not emotionally invested. This is a conversion opportunity—viewers are open to being influenced.';
                metric = `${stats.neutral_pct.toFixed(0)}% Neutral Sentiment`;
                accentClass = 'border-blue';
            } else if (stats.positive_pct >= 50) {
                icon = '🚀';
                title = 'Strong Positive Momentum';
                description = 'Your content is resonating well with your audience. Now is the time to amplify reach and convert engagement into action.';
                metric = `${stats.positive_pct.toFixed(0)}% Positive Sentiment`;
                accentClass = 'border-green';
            } else if (stats.negative_pct >= 30) {
                icon = '⚠️';
                title = 'Audience Concern Detected';
                description = 'Significant negative sentiment requires immediate attention. Understanding the root cause is critical for course correction.';
                metric = `${stats.negative_pct.toFixed(0)}% Negative Sentiment`;
                accentClass = 'border-orange';
            } else if (stats.total < 10) {
                icon = '📢';
                title = 'Early Stage Community';
                description = 'You are in the foundation phase. Focus on consistency, engagement, and building a core audience base.';
                metric = `${stats.total} Total Comments`;
                accentClass = 'border-blue';
            } else {
                icon = '📊';
                title = 'Balanced Engagement';
                description = 'Your audience shows mixed reactions. Identify what's working and double down on those themes.';
                metric = 'Mixed Sentiment';
                accentClass = 'border-green';
            }
            
            // Update hero section
            const hero = document.querySelector('.insight-hero');
            hero.className = `insight-hero ${accentClass}`;
            document.querySelector('.insight-icon').textContent = icon;
            document.getElementById('insightTitle').textContent = title;
            document.getElementById('insightDescription').textContent = description;
            document.getElementById('insightMetric').textContent = metric;
        }

        function generateActions(recommendations) {
            const actionsList = document.getElementById('actionsList');
            
            // Parse recommendations and create strategic actions
            let actions = [];
            
            if (recommendations && recommendations.length > 0) {
                // Extract clean recommendations (remove arrows and icons)
                actions = recommendations.map(rec => {
                    return rec.replace(/→|📺|💬|🎯/g, '').trim();
                }).slice(0, 3); // Top 3 recommendations
            }
            
            // Fallback generic actions if none provided
            if (actions.length === 0) {
                actions = [
                    'Increase posting consistency to build regular viewership and audience expectation',
                    'Create content that invites discussion—ask questions, create polls, encourage commentary',
                    'Analyze top-performing videos and replicate what works in future content'
                ];
            }
            
            // Generate HTML
            const actionsHTML = actions.map((action, index) => {
                const labels = ['Content', 'Engagement', 'Growth'];
                return `
                    <div class="action-item">
                        <div class="action-label">${labels[index] || 'Strategy'}</div>
                        <div class="action-text">${action}</div>
                    </div>
                `;
            }).join('');
            
            actionsList.innerHTML = actionsHTML;
        }

        function displayTopComments(topPositive, topNegative) {
            const container = document.getElementById('topComments');
            let html = '';
            
            if (topPositive && topPositive.length > 0) {
                html += '<h3 style="font-size: var(--type-medium); margin: var(--space-md) 0 var(--space-sm) 0;">Top Positive Comments</h3>';
                html += '<div class="comments-list">';
                topPositive.slice(0, 3).forEach(comment => {
                    html += `
                        <div class="comment-item">
                            <div class="comment-meta">
                                <span>${comment.author || 'Anonymous'}</span>
                                <span class="accent-green">+${comment.sentiment_score.toFixed(2)}</span>
                            </div>
                            <div class="comment-text">${comment.text}</div>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p style="color: var(--text-gray); margin: var(--space-md) 0;">No significant positive comments detected</p>';
            }
            
            if (topNegative && topNegative.length > 0) {
                html += '<h3 style="font-size: var(--type-medium); margin: var(--space-md) 0 var(--space-sm) 0;">Top Negative Comments</h3>';
                html += '<div class="comments-list">';
                topNegative.slice(0, 3).forEach(comment => {
                    html += `
                        <div class="comment-item">
                            <div class="comment-meta">
                                <span>${comment.author || 'Anonymous'}</span>
                                <span class="accent-orange">${comment.sentiment_score.toFixed(2)}</span>
                            </div>
                            <div class="comment-text">${comment.text}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            container.innerHTML = html;
        }

        // Load data on page load
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
