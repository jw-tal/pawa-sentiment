name: Update Pawa TV Dashboard

on:
  schedule:
    # Runs every day at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install google-api-python-client textblob
        python -m textblob.download_corpora
        
    - name: Run YouTube data collection
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: |
        python update_dashboard.py
        
    - name: Commit and push if changed
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "GitHub Actions Bot"
        git add youtube_dashboard_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: YouTube sentiment data $(date +'%Y-%m-%d %H:%M:%S')" && git push)
